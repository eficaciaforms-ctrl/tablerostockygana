<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00447C">
<title>Stock &amp; Gana — Tablero</title>
<style>
  :root{
    --azul-profundo:#00447C;
    --azul:#005FA4;
    --azul-medio:#0083C9;
    --cian:#29ABE2;
    --cian-suave:#E8F4FB;
    --cian-borde:#C7E3F5;
    --tinta:#191415;
    --gris:#5F6C77;
    --gris-claro:#8A97A1;
    --papel:#F4F7FA;
    --linea:#DDE6ED;
    --verde:#1B8C5A;
    --verde-suave:#E4F4EC;
    --ambar:#A96B00;
    --ambar-suave:#FCF1DE;
    --rojo:#C0392B;
    --rojo-suave:#FBEAE8;
    --sombra:0 1px 3px rgba(0,68,124,.08);
  }
  *{box-sizing:border-box}
  body{margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--papel); color:var(--tinta); font-size:14px; line-height:1.5}

  /* ---------- Cabecera ---------- */
  .marca{
    background:#fff; border-bottom:1px solid var(--linea); padding:12px 24px;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    position:sticky; top:0; z-index:40;
  }
  .marca img{height:38px; width:auto; display:block}
  .marca .div{width:1px; height:34px; background:var(--linea)}
  .marca h1{font-size:17px; margin:0; color:var(--azul-profundo); letter-spacing:.2px}
  .marca h1 span{display:block; font-size:12px; color:var(--gris); font-weight:normal; margin-top:1px}
  .marca .der{margin-left:auto; display:flex; align-items:center; gap:9px; flex-wrap:wrap}
  .sello{font-size:12px; color:var(--gris); white-space:nowrap}
  .punto{width:8px; height:8px; border-radius:50%; background:var(--verde); display:inline-block; margin-right:6px; vertical-align:0}
  .punto.mal{background:var(--ambar)}

  select, input, button{font-family:inherit; font-size:13px; color:var(--tinta)}
  .campo{padding:8px 11px; border:1px solid var(--linea); border-radius:7px; background:#fff}
  .btn{padding:9px 15px; border-radius:7px; border:0; background:var(--azul); color:#fff; cursor:pointer; font-weight:bold}
  .btn:hover{background:var(--azul-profundo)}
  .btn.claro{background:var(--cian-suave); color:var(--azul-profundo); border:1px solid var(--cian-borde)}

  /* ---------- Navegación ---------- */
  nav{background:var(--azul-profundo); padding:0 24px; position:sticky; top:63px; z-index:35; display:flex; gap:2px; overflow-x:auto}
  nav button{
    background:none; border:0; color:rgba(255,255,255,.72); padding:13px 20px; cursor:pointer;
    font-size:14px; border-bottom:3px solid transparent; white-space:nowrap;
  }
  nav button:hover{color:#fff}
  nav button.act{color:#fff; font-weight:bold; border-bottom-color:var(--cian)}

  main{padding:22px 24px 60px; max-width:1560px; margin:0 auto}
  h2.sec{font-size:16px; margin:0 0 3px; color:var(--azul-profundo)}
  p.sub{color:var(--gris); margin:0 0 16px; font-size:13px}

  /* ---------- KPIs ---------- */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:22px}
  .kpi{background:#fff; border:1px solid var(--linea); border-top:3px solid var(--cian); border-radius:10px; padding:16px; box-shadow:var(--sombra)}
  .kpi .rot{font-size:12px; color:var(--gris); margin-bottom:7px; min-height:32px}
  .kpi .val{font-size:30px; font-weight:bold; color:var(--azul-profundo); line-height:1}
  .kpi .pie{font-size:12px; color:var(--gris-claro); margin-top:6px}
  .kpi.ok{border-top-color:var(--verde)} .kpi.ok .val{color:var(--verde)}
  .kpi.alerta{border-top-color:var(--rojo)} .kpi.alerta .val{color:var(--rojo)}
  .kpi.aviso{border-top-color:var(--ambar)} .kpi.aviso .val{color:var(--ambar)}

  /* ---------- Tarjetas y tablas ---------- */
  .rejilla{display:grid; grid-template-columns:repeat(auto-fit,minmax(430px,1fr)); gap:16px}
  .caja{background:#fff; border:1px solid var(--linea); border-radius:10px; box-shadow:var(--sombra); overflow:hidden; margin-bottom:16px}
  .caja > h3{
    margin:0; padding:13px 16px; font-size:14px; color:var(--azul-profundo);
    background:var(--cian-suave); border-bottom:1px solid var(--cian-borde);
  }
  .caja > h3 small{float:right; color:var(--gris); font-weight:normal}
  .cuerpo{padding:16px}

  table{width:100%; border-collapse:collapse}
  th{
    text-align:left; font-size:11px; letter-spacing:.4px; text-transform:uppercase; color:var(--gris);
    font-weight:bold; padding:10px 14px; border-bottom:1px solid var(--linea); background:#FAFCFD;
  }
  td{padding:11px 14px; border-bottom:1px solid var(--linea); vertical-align:middle}
  tbody tr:last-child td{border-bottom:0}
  tbody tr.clic{cursor:pointer}
  tbody tr.clic:hover{background:var(--cian-suave)}
  td.num, th.num{text-align:right; font-variant-numeric:tabular-nums}
  td small{color:var(--gris-claro); font-size:12px}

  .eti{display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; white-space:nowrap; font-weight:bold}
  .eti.ok{background:var(--verde-suave); color:var(--verde)}
  .eti.no{background:var(--ambar-suave); color:var(--ambar)}
  .eti.pen{background:#EEF2F5; color:var(--gris)}
  .eti.mal{background:var(--rojo-suave); color:var(--rojo)}
  .eti.m{background:var(--azul); color:#fff; padding:2px 7px}
  .eti.a{background:var(--cian-suave); color:var(--azul); padding:2px 7px; border:1px solid var(--cian-borde)}

  .barra{height:7px; background:#EEF2F5; border-radius:4px; overflow:hidden; min-width:80px}
  .barra i{display:block; height:100%; background:var(--azul-medio)}
  .barra.lleno i{background:var(--verde)}
  .barra.bajo i{background:var(--rojo)}

  .vacio{padding:40px 20px; text-align:center; color:var(--gris-claro)}
  .aviso{background:var(--ambar-suave); color:var(--ambar); padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:13px}

  /* ---------- Fotos ---------- */
  .tiras{display:flex; gap:5px}
  .tiras img{width:40px; height:40px; object-fit:cover; border-radius:5px; border:1px solid var(--linea); cursor:pointer; background:#EEF2F5}
  .galeria{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px}
  .galeria figure{margin:0; background:#fff; border:1px solid var(--linea); border-radius:9px; overflow:hidden}
  .galeria img{width:100%; height:150px; object-fit:cover; display:block; cursor:pointer; background:#EEF2F5}
  .galeria figcaption{padding:8px 10px; font-size:12px; color:var(--gris)}
  .galeria figcaption b{display:block; color:var(--tinta); font-size:12px}
  .lupa{position:fixed; inset:0; background:rgba(10,30,45,.92); z-index:60; display:flex; align-items:center;
    justify-content:center; padding:24px; flex-direction:column; gap:14px}
  .lupa img{max-width:100%; max-height:80vh; border-radius:8px}
  .lupa a{color:var(--cian); font-size:13px}
  .lupa .cap{color:#fff; font-size:14px}

  /* ---------- Acceso ---------- */
  .acceso{max-width:400px; margin:70px auto; background:#fff; border:1px solid var(--linea); border-radius:12px; padding:28px; box-shadow:var(--sombra)}
  .acceso img{height:44px; margin-bottom:18px}
  .acceso h2{margin:0 0 6px; color:var(--azul-profundo); font-size:18px}
  .acceso p{color:var(--gris); margin:0 0 18px; font-size:13px}
  .acceso input{width:100%; padding:12px; border:1px solid var(--linea); border-radius:8px; margin-bottom:12px; font-size:15px}
  .acceso .btn{width:100%; padding:13px}

  .fila-filtro{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
  .fila-filtro label{font-size:12px; color:var(--gris)}
  .oculto{display:none !important}
  @media (max-width:900px){
    main{padding:14px} .marca{padding:10px 14px} nav{padding:0 14px; top:60px}
    .rejilla{grid-template-columns:1fr} td,th{padding:9px 10px}
  }
</style>
</head>

<script>
/* ===================== Configuración ===================== */
const URL_BACKEND = 'https://script.google.com/macros/s/AKfycbytJH_iXnHILtr_NaOSHXZt90TRyLkEomDIcbjrdb3okyjJKpjHuQRhc3DAL1Cayj2g/exec';
const REFRESCO_MS = 60000;

const Guardado = (function(){
  let mem = {}, ok = true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok = false; }
  return { get: k => { try{ return ok ? localStorage.getItem(k) : mem[k]; }catch(e){ return mem[k]; } },
           set: (k,v) => { try{ ok ? localStorage.setItem(k,v) : (mem[k]=v); }catch(e){ mem[k]=v; } } };
})();

let clave = Guardado.get('clave_tablero') || '';
let D = null, vista = 'resumen', cargando = false;
let clienteSel = '', clienteFotos = '';

/* ===================== Utilidades ===================== */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const soles = n => 'S/ ' + (Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2, maximumFractionDigits:2});
const num = n => (Number(n)||0).toLocaleString('es-PE');
const pct = n => Math.round((Number(n)||0)*100) + '%';
const hora = h => String(h||'').slice(0,5);

function fechaDesde(dias){
  const d = new Date(); d.setDate(d.getDate() - Number(dias));
  return d.toISOString().slice(0,10);
}

/** Convierte el enlace de Drive en miniatura visible en el navegador. */
function foto(url, ancho){
  if(!url || String(url).indexOf('drive.google') < 0) return '';
  const m = String(url).match(/[-\w]{25,}/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[0] + '&sz=w' + (ancho||600) : '';
}

function jsonp(url){
  return new Promise((resolve, reject) => {
    const cb = 'cbTab' + Date.now();
    const et = document.createElement('script');
    const limpiar = () => { delete window[cb]; et.remove(); };
    const reloj = setTimeout(() => { limpiar(); reject(new Error('tiempo agotado')); }, 40000);
    window[cb] = d => { clearTimeout(reloj); limpiar(); resolve(d); };
    et.onerror = () => { clearTimeout(reloj); limpiar(); reject(new Error('sin respuesta del servidor')); };
    et.src = url + '&callback=' + cb;
    document.body.appendChild(et);
  });
}

/* ===================== Carga ===================== */
async function cargar(silencioso){
  if(!clave){ pintarAcceso(); return; }
  if(cargando) return;
  cargando = true;
  $('sello').innerHTML = '<span class="punto"></span>Actualizando…';
  try{
    const d = await jsonp(URL_BACKEND + '?recurso=datos&clave=' + encodeURIComponent(clave) +
      '&desde=' + fechaDesde($('periodo').value) + '&t=' + Date.now());
    if(!d.ok){
      if(String(d.error).includes('Clave')){ clave=''; Guardado.set('clave_tablero',''); pintarAcceso('La clave no coincide con la del Apps Script.'); return; }
      throw new Error(d.error);
    }
    D = d;
    D.portafolio = D.portafolio || [];
    D.cartera = D.cartera || [];
    $('nav').classList.remove('oculto');
    llenarFiltros();
    pintar();
    $('sello').innerHTML = '<span class="punto"></span>Actualizado ' + String(d.actualizado).slice(11,16);
  }catch(e){
    $('sello').innerHTML = '<span class="punto mal"></span>Sin conexión';
    if(!silencioso) $('app').innerHTML = '<div class="aviso">No se pudo leer la data: ' + esc(e.message) +
      '. Verifica la implementación del Apps Script y la clave.</div>';
  }finally{ cargando = false; }
}

function pintarAcceso(msg){
  $('controles').classList.add('oculto');
  $('nav').classList.add('oculto');
  $('app').innerHTML = `<div class="acceso">
    <h2>Acceso al tablero</h2>
    <p>Ingresa la clave configurada en el Apps Script.</p>
    ${msg ? '<div class="aviso">'+esc(msg)+'</div>' : ''}
    <input type="password" id="cl" placeholder="Clave" autocomplete="current-password">
    <button class="btn" id="entrar">Entrar</button></div>`;
  $('entrar').onclick = () => {
    const v = $('cl').value.trim(); if(!v) return;
    clave = v; Guardado.set('clave_tablero', v);
    $('controles').classList.remove('oculto');
    cargar();
  };
  $('cl').onkeydown = e => { if(e.key === 'Enter') $('entrar').click(); };
}

function llenarFiltros(){
  const rellenar = (id, valores, etiqueta) => {
    const sel = $(id), actual = sel.value;
    sel.innerHTML = '<option value="">' + etiqueta + '</option>' +
      [...new Set(valores)].filter(Boolean).sort().map(v => `<option ${v===actual?'selected':''}>${esc(v)}</option>`).join('');
  };
  rellenar('fMercado', D.visitas.map(v => v.MERCADO), 'Todos los mercados');
  rellenar('fMerc', D.visitas.map(v => v.MERCADERISTA), 'Todos los mercaderistas');
}

/* ===================== Filtros y cálculo ===================== */
function pasa(f){
  const m = $('fMercado').value, p = $('fMerc').value;
  return (!m || f.MERCADO === m) && (!p || f.MERCADERISTA === p);
}
const visitas = () => (D.visitas || []).filter(pasa);
const relevos = () => (D.relevos || []).filter(pasa);
const boletas = () => (D.boletas || []).filter(pasa);
const modulos = () => (D.modulos || []).filter(pasa);

const mandatorios = () => D.portafolio.filter(p => p.RELEVANCIA === 'MANDATORIO');
const adicionales = () => D.portafolio.filter(p => p.RELEVANCIA === 'ADICIONAL');

/** Presencia del portafolio objetivo por visita: un SKU "está" si tiene unidades en algún punto del PDV. */
function coberturaVisita(idVisita){
  const R = (D.relevos||[]).filter(r => r.ID_VISITA === idVisita && r.TIPO_RELEVO !== 'BOLETA');
  const conStock = new Set(R.filter(r => Number(r.UNIDADES) > 0).map(r => r.COD_SKU));
  const enExhibicion = new Set(R.filter(r => r.TIPO_RELEVO === 'EXHIBICION' && Number(r.UNIDADES) > 0).map(r => r.COD_SKU));
  const enAlmacen = new Set(R.filter(r => r.TIPO_RELEVO === 'ALMACEN' && Number(r.UNIDADES) > 0).map(r => r.COD_SKU));
  const evaluar = lista => {
    const ok = lista.filter(p => conStock.has(p.COD_SKU));
    return { total: lista.length, ok: ok.length, faltan: lista.filter(p => !conStock.has(p.COD_SKU)) };
  };
  return { mand: evaluar(mandatorios()), adic: evaluar(adicionales()), conStock, enExhibicion, enAlmacen };
}

/** Última visita registrada de cada cliente en el periodo filtrado. */
function ultimaPorCliente(){
  const mapa = {};
  visitas().forEach(v => {
    const k = v.COD_CLIENTE;
    if(!mapa[k] || (v.FECHA + v.HORA) > (mapa[k].FECHA + mapa[k].HORA)) mapa[k] = v;
  });
  return mapa;
}

/* ===================== Render ===================== */
function pintar(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('act', b.dataset.v === vista));
  ({resumen, clientes: vistaClientes, productos: vistaProductos, compras: vistaCompras, fotos: vistaFotos})[vista]();
  conectarLupa();
}

/* ---------- 1. Resumen ---------- */
function resumen(){
  const V = visitas(), B = boletas(), M = modulos();
  const ultimas = ultimaPorCliente();
  const codigos = Object.keys(ultimas);
  const totalCartera = (D.cartera && D.cartera.length) || 0;
  const nMand = mandatorios().length, nAdic = adicionales().length;

  let sumaMand = 0, sumaAdic = 0, completos = 0;
  const porCliente = codigos.map(c => {
    const v = ultimas[c], cob = coberturaVisita(v.ID_VISITA);
    sumaMand += cob.mand.ok; sumaAdic += cob.adic.ok;
    if(cob.mand.ok === nMand && nMand) completos++;
    return { v, cob };
  }).sort((a,b) => (a.cob.mand.ok/(nMand||1)) - (b.cob.mand.ok/(nMand||1)));

  const pMand = codigos.length && nMand ? sumaMand / (codigos.length * nMand) : 0;
  const pAdic = codigos.length && nAdic ? sumaAdic / (codigos.length * nAdic) : 0;
  const monto = B.reduce((t,b) => t + (Number(b.TOTAL)||0), 0);
  const clientesCompra = new Set(B.map(b => b.COD_CLIENTE)).size;
  const noRel = M.filter(m => m.ESTADO === 'NO_RELEVADO');

  // Ausencias por SKU del portafolio objetivo
  const ausencias = {};
  D.portafolio.forEach(p => ausencias[p.COD_SKU] = { p, falta: 0 });
  porCliente.forEach(x => {
    x.cob.mand.faltan.concat(x.cob.adic.faltan).forEach(p => { ausencias[p.COD_SKU].falta++; });
  });
  const ranking = Object.values(ausencias).filter(a => a.falta > 0).sort((a,b) => b.falta - a.falta).slice(0, 12);

  $('app').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="rot">Cobertura de cartera</div>
        <div class="val">${codigos.length}<span style="font-size:16px; color:var(--gris-claro)">/${totalCartera}</span></div>
        <div class="pie">Clientes visitados en el periodo</div></div>

      <div class="kpi ${pMand>=0.9?'ok':(pMand<0.7?'alerta':'aviso')}"><div class="rot">Portafolio mandatorio disponible</div>
        <div class="val">${codigos.length ? pct(pMand) : '—'}</div>
        <div class="pie">Promedio sobre ${nMand} SKU obligatorios</div></div>

      <div class="kpi ${pAdic>=0.9?'ok':(pAdic<0.5?'alerta':'aviso')}"><div class="rot">Portafolio adicional disponible</div>
        <div class="val">${codigos.length ? pct(pAdic) : '—'}</div>
        <div class="pie">Promedio sobre ${nAdic} SKU adicionales</div></div>

      <div class="kpi ${completos===codigos.length && codigos.length ? 'ok':'aviso'}"><div class="rot">Clientes con portafolio mandatorio completo</div>
        <div class="val">${completos}<span style="font-size:16px; color:var(--gris-claro)">/${codigos.length}</span></div>
        <div class="pie">Los ${nMand} SKU obligatorios presentes</div></div>

      <div class="kpi"><div class="rot">Clientes con compra registrada</div>
        <div class="val">${clientesCompra}</div>
        <div class="pie">${B.length} boleta(s) · ${soles(monto)}</div></div>

      <div class="kpi ${noRel.length?'aviso':'ok'}"><div class="rot">Módulos no relevados</div>
        <div class="val">${noRel.length}</div>
        <div class="pie">De ${V.length * 3} posibles en el periodo</div></div>
    </div>

    <div class="caja">
      <h3>Cumplimiento de portafolio por cliente <small>ordenado de menor a mayor</small></h3>
      ${porCliente.length ? `<table><thead><tr>
        <th>Cliente</th><th>Mercado</th><th>Última visita</th>
        <th>Mandatorio (${nMand})</th><th>Adicional (${nAdic})</th><th>SKU faltantes</th><th class="num">Compra</th>
      </tr></thead><tbody>${porCliente.map(x => {
        const rM = x.cob.mand.ok / (nMand||1), rA = x.cob.adic.ok / (nAdic||1);
        const faltantes = x.cob.mand.faltan.slice(0,3).map(p => p.DESCRIPCION).join(', ');
        const resto = x.cob.mand.faltan.length - 3;
        return `<tr class="clic" data-cli="${esc(x.v.COD_CLIENTE)}">
          <td><b>${esc(x.v.CLIENTE)}</b><br><small>${esc(x.v.COD_CLIENTE)}</small></td>
          <td>${esc(x.v.MERCADO)}</td>
          <td>${esc(x.v.FECHA)}<br><small>${esc(x.v.MERCADERISTA)}</small></td>
          <td><div class="barra ${rM===1?'lleno':(rM<0.7?'bajo':'')}"><i style="width:${Math.round(rM*100)}%"></i></div>
            <small>${x.cob.mand.ok} de ${nMand}</small></td>
          <td><div class="barra ${rA===1?'lleno':(rA<0.5?'bajo':'')}"><i style="width:${Math.round(rA*100)}%"></i></div>
            <small>${x.cob.adic.ok} de ${nAdic}</small></td>
          <td><small>${x.cob.mand.faltan.length ? esc(faltantes) + (resto>0 ? ' y ' + resto + ' más' : '') : 'Ninguno'}</small></td>
          <td class="num">${Number(x.v.MONTO_BOLETAS) ? soles(x.v.MONTO_BOLETAS) : '—'}</td>
        </tr>`;
      }).join('')}</tbody></table>` : '<div class="vacio">Sin visitas en el periodo seleccionado.</div>'}
    </div>

    <div class="rejilla">
      <div class="caja">
        <h3>SKU con mayor ausencia en el canal</h3>
        ${ranking.length ? `<table><thead><tr><th>Producto</th><th>Tipo</th><th class="num">Clientes sin el SKU</th></tr></thead>
          <tbody>${ranking.map(a => `<tr>
            <td>${esc(a.p.DESCRIPCION)}<br><small>${esc(a.p.COD_SKU)} · ${esc(a.p.MARCA)}</small></td>
            <td>${a.p.RELEVANCIA === 'MANDATORIO' ? '<span class="eti m">Mandatorio</span>' : '<span class="eti a">Adicional</span>'}</td>
            <td class="num"><b>${a.falta}</b> de ${codigos.length}</td></tr>`).join('')}</tbody></table>`
          : '<div class="vacio">Todos los clientes visitados cuentan con el portafolio objetivo.</div>'}
      </div>

      <div class="caja">
        <h3>Motivos de no relevo</h3>
        ${noRel.length ? (() => {
          const c = {}; noRel.forEach(m => { const k = m.MODULO+'||'+m.MOTIVO; c[k] = (c[k]||0)+1; });
          return `<table><thead><tr><th>Módulo</th><th>Motivo</th><th class="num">Casos</th></tr></thead><tbody>${
            Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,n]) => { const [mo,mt] = k.split('||');
              return `<tr><td>${esc(mo)}</td><td>${esc(mt)}</td><td class="num"><b>${n}</b></td></tr>`; }).join('')}</tbody></table>`;
        })() : '<div class="vacio">Ningún módulo quedó sin relevar.</div>'}
      </div>
    </div>`;

  document.querySelectorAll('[data-cli]').forEach(tr => tr.onclick = () => {
    clienteSel = tr.dataset.cli; vista = 'clientes'; pintar(); window.scrollTo(0,0);
  });
}

/* ---------- 2. Detalle por cliente ---------- */
function selectorCliente(id, valor){
  const ultimas = ultimaPorCliente();
  const lista = Object.values(ultimas).sort((a,b) => String(a.CLIENTE).localeCompare(String(b.CLIENTE)));
  return `<div class="fila-filtro"><label for="${id}">Cliente</label>
    <select class="campo" id="${id}" style="min-width:320px">
      <option value="">Selecciona un cliente</option>
      ${lista.map(v => `<option value="${esc(v.COD_CLIENTE)}" ${valor===v.COD_CLIENTE?'selected':''}>
        ${esc(v.CLIENTE)} — ${esc(v.MERCADO)}</option>`).join('')}
    </select></div>`;
}

function vistaClientes(){
  const ultimas = ultimaPorCliente();
  if(!clienteSel || !ultimas[clienteSel]) clienteSel = Object.keys(ultimas)[0] || '';
  const v = ultimas[clienteSel];

  $('app').innerHTML = `<h2 class="sec">Detalle del relevo por cliente</h2>
    <p class="sub">Muestra la última visita registrada de cada cliente en el periodo.</p>
    ${selectorCliente('selCli', clienteSel)}
    <div id="ficha"></div>`;
  $('selCli').onchange = e => { clienteSel = e.target.value; vistaClientes(); conectarLupa(); };
  if(!v){ $('ficha').innerHTML = '<div class="caja"><div class="vacio">Sin visitas en el periodo.</div></div>'; return; }

  const cob = coberturaVisita(v.ID_VISITA);
  const R = (D.relevos||[]).filter(r => r.ID_VISITA === v.ID_VISITA);
  const B = (D.boletas||[]).filter(b => b.ID_VISITA === v.ID_VISITA);
  const M = (D.modulos||[]).filter(m => m.ID_VISITA === v.ID_VISITA);
  const und = (cod, tipo) => {
    const l = R.find(r => r.COD_SKU === cod && r.TIPO_RELEVO === tipo);
    return l ? Number(l.UNIDADES) : null;
  };
  const nMand = mandatorios().length, nAdic = adicionales().length;
  const estado = mod => {
    const m = M.find(x => x.MODULO === mod);
    if(!m) return '<span class="eti pen">Sin registro</span>';
    if(m.ESTADO === 'COMPLETO') return '<span class="eti ok">Relevado</span>';
    if(m.ESTADO === 'NO_RELEVADO') return `<span class="eti no">No relevado</span> <small>${esc(m.MOTIVO)}</small>`;
    return '<span class="eti pen">Pendiente</span>';
  };

  const filaSku = p => {
    const a = und(p.COD_SKU,'ALMACEN'), e = und(p.COD_SKU,'EXHIBICION');
    const hay = (a||0) > 0 || (e||0) > 0;
    return `<tr>
      <td>${p.RELEVANCIA==='MANDATORIO'?'<span class="eti m">M</span> ':'<span class="eti a">A</span> '}${esc(p.DESCRIPCION)}
        <br><small>${esc(p.COD_SKU)} · ${esc(p.MARCA)}</small></td>
      <td class="num">${a===null ? '<small>no relevado</small>' : num(a)}</td>
      <td class="num">${e===null ? '<small>no relevado</small>' : num(e)}</td>
      <td>${hay ? '<span class="eti ok">Disponible</span>' : '<span class="eti mal">Ausente</span>'}</td>
    </tr>`;
  };

  const otros = R.filter(r => r.TIPO_RELEVO !== 'BOLETA' && !D.portafolio.some(p => p.COD_SKU === r.COD_SKU));
  const otrosCod = [...new Set(otros.map(r => r.COD_SKU))];
  const fotos = [[v.FOTO_ALMACEN,'Panorámica de almacén'],[v.FOTO_EXHIBICION,'Panorámica de exhibición']]
    .concat(B.flatMap(b => [[b.FOTO_FECHA, 'Boleta '+b.SERIE+'-'+b.NUMERO+' · fecha'],
      [b.FOTO_PRODUCTOS,'Boleta '+b.SERIE+'-'+b.NUMERO+' · productos'],
      [b.FOTO_COMPLETA,'Boleta '+b.SERIE+'-'+b.NUMERO+' · completa']]))
    .filter(f => foto(f[0]));

  $('ficha').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="rot">Visita</div><div class="val" style="font-size:20px">${esc(v.FECHA)}</div>
        <div class="pie">${hora(v.HORA)} · ${esc(v.MERCADERISTA)}</div></div>
      <div class="kpi ${cob.mand.ok===nMand?'ok':'aviso'}"><div class="rot">Portafolio mandatorio</div>
        <div class="val">${cob.mand.ok}/${nMand}</div><div class="pie">${cob.mand.faltan.length} ausente(s)</div></div>
      <div class="kpi ${cob.adic.ok===nAdic?'ok':'aviso'}"><div class="rot">Portafolio adicional</div>
        <div class="val">${cob.adic.ok}/${nAdic}</div><div class="pie">${cob.adic.faltan.length} ausente(s)</div></div>
      <div class="kpi"><div class="rot">Compra registrada</div>
        <div class="val" style="font-size:22px">${B.length ? soles(v.MONTO_BOLETAS) : '—'}</div>
        <div class="pie">${B.length} boleta(s)</div></div>
    </div>

    <div class="caja"><h3>Estado de los módulos</h3><div class="cuerpo">
      <table><tbody>
        <tr><td style="width:180px"><b>Stock de almacén</b></td><td>${estado('ALMACEN')}</td></tr>
        <tr><td><b>Stock de exhibición</b></td><td>${estado('EXHIBICION')}</td></tr>
        <tr><td><b>Boletas</b></td><td>${estado('BOLETA')}</td></tr>
        ${v.OBSERVACIONES ? `<tr><td><b>Observaciones</b></td><td>${esc(v.OBSERVACIONES)}</td></tr>` : ''}
        ${v.GEO ? `<tr><td><b>Ubicación</b></td><td><a href="https://www.google.com/maps?q=${esc(v.GEO)}" target="_blank" rel="noopener">Ver en el mapa</a></td></tr>` : ''}
      </tbody></table></div></div>

    <div class="caja"><h3>Portafolio objetivo en el punto de venta
      <small>${cob.mand.ok + cob.adic.ok} de ${nMand + nAdic} disponibles</small></h3>
      <table><thead><tr><th>Producto</th><th class="num">Almacén</th><th class="num">Exhibición</th><th>Estado</th></tr></thead>
      <tbody>${mandatorios().concat(adicionales()).map(filaSku).join('')}</tbody></table></div>

    ${otrosCod.length ? `<div class="caja"><h3>Otros SKU relevados <small>fuera del portafolio objetivo</small></h3>
      <table><thead><tr><th>Producto</th><th class="num">Almacén</th><th class="num">Exhibición</th></tr></thead>
      <tbody>${otrosCod.map(c => { const r = otros.find(x => x.COD_SKU === c);
        return `<tr><td>${esc(r.DESCRIPCION)}<br><small>${esc(c)}</small></td>
          <td class="num">${und(c,'ALMACEN')===null?'—':num(und(c,'ALMACEN'))}</td>
          <td class="num">${und(c,'EXHIBICION')===null?'—':num(und(c,'EXHIBICION'))}</td></tr>`; }).join('')}
      </tbody></table></div>` : ''}

    ${B.length ? `<div class="caja"><h3>Boletas de la visita</h3>${B.map(b => `
      <table><thead><tr><th colspan="3">${esc(b.SERIE)}-${esc(b.NUMERO)} · ${esc(b.FECHA_BOLETA)} · ${soles(b.TOTAL)}</th></tr></thead>
      <tbody>${(D.relevos||[]).filter(r => r.ID_BOLETA === b.ID_BOLETA).map(r => `
        <tr><td>${esc(r.DESCRIPCION)}<br><small>${esc(r.COD_SKU)}</small></td>
          <td class="num">${num(r.UNIDADES)} × ${soles(r.PRECIO_UNIT)}</td>
          <td class="num"><b>${soles(r.VALOR)}</b></td></tr>`).join('')}</tbody></table>`).join('')}</div>` : ''}

    <div class="caja"><h3>Fotos de la visita <small>${fotos.length}</small></h3><div class="cuerpo">
      ${fotos.length ? '<div class="galeria">' + fotos.map(f => `<figure>
        <img src="${foto(f[0],400)}" data-grande="${foto(f[0],1600)}" data-orig="${esc(f[0])}" data-cap="${esc(f[1])}" alt="${esc(f[1])}" loading="lazy">
        <figcaption>${esc(f[1])}</figcaption></figure>`).join('') + '</div>'
        : '<div class="vacio">Sin fotos registradas.</div>'}
    </div></div>`;
  conectarLupa();
}

/* ---------- 3. Productos ---------- */
function vistaProductos(){
  const R = relevos().filter(r => r.TIPO_RELEVO !== 'BOLETA');
  const ultimas = ultimaPorCliente();
  const nClientes = Object.keys(ultimas).length;

  const mapa = {};
  D.portafolio.forEach(p => mapa[p.COD_SKU] = {cod:p.COD_SKU, desc:p.DESCRIPCION, marca:p.MARCA, rel:p.RELEVANCIA,
    alm:0, exh:0, pdvExh:0, pdvAlm:0, presentes:0});
  R.forEach(r => {
    const k = r.COD_SKU;
    mapa[k] = mapa[k] || {cod:k, desc:r.DESCRIPCION, marca:r.MARCA, rel:r.RELEVANCIA||'REGULAR',
      alm:0, exh:0, pdvExh:0, pdvAlm:0, presentes:0};
    const u = Number(r.UNIDADES)||0;
    if(r.TIPO_RELEVO === 'ALMACEN'){ mapa[k].alm += u; if(u>0) mapa[k].pdvAlm++; }
    else { mapa[k].exh += u; if(u>0) mapa[k].pdvExh++; }
  });
  Object.values(ultimas).forEach(v => {
    const cob = coberturaVisita(v.ID_VISITA);
    cob.conStock.forEach(cod => { if(mapa[cod]) mapa[cod].presentes++; });
  });

  const compras = {};
  relevos().filter(r => r.TIPO_RELEVO === 'BOLETA').forEach(r => {
    const c = compras[r.COD_SKU] = compras[r.COD_SKU] || {u:0, v:0};
    c.u += Number(r.UNIDADES)||0; c.v += Number(r.VALOR)||0;
  });

  const orden = {MANDATORIO:0, ADICIONAL:1, REGULAR:2};
  const filas = Object.values(mapa).sort((a,b) =>
    (orden[a.rel]??3) - (orden[b.rel]??3) || a.presentes - b.presentes || b.exh - a.exh);

  $('app').innerHTML = `<h2 class="sec">Productos relevados</h2>
    <p class="sub">Unidades acumuladas en el periodo y presencia sobre los ${nClientes} clientes visitados.</p>
    <div class="caja">
      ${filas.length ? `<table><thead><tr>
        <th>Producto</th><th>Tipo</th><th class="num">Und. almacén</th><th class="num">Und. exhibición</th>
        <th>Presencia en PDV</th><th class="num">Precio promedio</th>
      </tr></thead><tbody>${filas.map(f => {
        const r = nClientes ? f.presentes / nClientes : 0;
        const enPortafolio = f.rel === 'MANDATORIO' || f.rel === 'ADICIONAL';
        return `<tr>
          <td>${esc(f.desc)}<br><small>${esc(f.cod)} · ${esc(f.marca)}</small></td>
          <td>${f.rel==='MANDATORIO' ? '<span class="eti m">Mandatorio</span>' :
                f.rel==='ADICIONAL' ? '<span class="eti a">Adicional</span>' : '<span class="eti pen">Regular</span>'}</td>
          <td class="num">${num(f.alm)}<br><small>${f.pdvAlm} PDV</small></td>
          <td class="num">${num(f.exh)}<br><small>${f.pdvExh} PDV</small></td>
          <td>${enPortafolio ? `<div class="barra ${r===1?'lleno':(r<0.7?'bajo':'')}"><i style="width:${Math.round(r*100)}%"></i></div>
              <small>${f.presentes} de ${nClientes}</small>` : `<small>${f.presentes} de ${nClientes}</small>`}</td>
          <td class="num">${compras[f.cod] && compras[f.cod].u ? soles(compras[f.cod].v / compras[f.cod].u) : '—'}</td>
        </tr>`; }).join('')}</tbody></table>` : '<div class="vacio">Sin productos relevados en el periodo.</div>'}
    </div>`;
}

/* ---------- 4. Compras y boletas ---------- */
function vistaCompras(){
  const B = boletas().slice().sort((a,b) => String(b.FECHA_BOLETA).localeCompare(String(a.FECHA_BOLETA)));
  const monto = B.reduce((t,b) => t + (Number(b.TOTAL)||0), 0);
  const unidades = B.reduce((t,b) => t + (Number(b.UNIDADES)||0), 0);
  const clientes = new Set(B.map(b => b.COD_CLIENTE)).size;
  const sinCompra = Object.values(ultimaPorCliente()).filter(v => !B.some(b => b.COD_CLIENTE === v.COD_CLIENTE));

  $('app').innerHTML = `<h2 class="sec">Clientes con compra registrada</h2>
    <p class="sub">Boletas relevadas con su detalle de productos del portafolio y las tres fotos del comprobante.</p>

    <div class="kpis">
      <div class="kpi"><div class="rot">Clientes con compra</div><div class="val">${clientes}</div>
        <div class="pie">${B.length} boleta(s) relevada(s)</div></div>
      <div class="kpi"><div class="rot">Monto en portafolio</div><div class="val" style="font-size:24px">${soles(monto)}</div>
        <div class="pie">${num(unidades)} unidades compradas</div></div>
      <div class="kpi"><div class="rot">Ticket promedio</div><div class="val" style="font-size:24px">${B.length ? soles(monto/B.length) : '—'}</div>
        <div class="pie">Por boleta</div></div>
      <div class="kpi ${sinCompra.length?'aviso':'ok'}"><div class="rot">Clientes sin compra registrada</div>
        <div class="val">${sinCompra.length}</div><div class="pie">Visitados en el periodo</div></div>
    </div>

    ${B.length ? B.map(b => {
      const lineas = (D.relevos||[]).filter(r => r.ID_BOLETA === b.ID_BOLETA);
      const fotos = [[b.FOTO_FECHA,'Fecha de emisión'],[b.FOTO_PRODUCTOS,'Productos'],[b.FOTO_COMPLETA,'Boleta completa']]
        .filter(f => foto(f[0]));
      return `<div class="caja">
        <h3>${esc(b.CLIENTE)} · ${esc(b.SERIE)}-${esc(b.NUMERO)}
          <small>${esc(b.MERCADO)} · emitida ${esc(b.FECHA_BOLETA)} · relevada ${esc(b.FECHA)}</small></h3>
        <table><thead><tr><th>Producto</th><th>Tipo</th><th class="num">Unidades</th>
          <th class="num">Precio unit.</th><th class="num">Total</th></tr></thead>
        <tbody>${lineas.map(r => `<tr>
          <td>${esc(r.DESCRIPCION)}<br><small>${esc(r.COD_SKU)} · ${esc(r.MARCA)}</small></td>
          <td>${r.RELEVANCIA==='MANDATORIO' ? '<span class="eti m">Mandatorio</span>' :
                r.RELEVANCIA==='ADICIONAL' ? '<span class="eti a">Adicional</span>' : '<span class="eti pen">Regular</span>'}</td>
          <td class="num">${num(r.UNIDADES)}</td><td class="num">${soles(r.PRECIO_UNIT)}</td>
          <td class="num"><b>${soles(r.VALOR)}</b></td></tr>`).join('')}
          <tr><td colspan="4" style="text-align:right"><b>Total del portafolio</b></td>
            <td class="num"><b style="color:var(--azul-profundo); font-size:15px">${soles(b.TOTAL)}</b></td></tr>
        </tbody></table>
        <div class="cuerpo"><div class="galeria">${fotos.map(f => `<figure>
          <img src="${foto(f[0],400)}" data-grande="${foto(f[0],1600)}" data-orig="${esc(f[0])}" data-cap="${esc(b.SERIE)}-${esc(b.NUMERO)} · ${esc(f[1])}" alt="${esc(f[1])}" loading="lazy">
          <figcaption><b>${esc(f[1])}</b>${esc(b.CLIENTE)}</figcaption></figure>`).join('')}</div></div>
      </div>`;
    }).join('') : '<div class="caja"><div class="vacio">Ningún cliente registró boletas en el periodo.</div></div>'}

    ${sinCompra.length ? `<div class="caja"><h3>Clientes visitados sin compra registrada</h3>
      <table><thead><tr><th>Cliente</th><th>Mercado</th><th>Última visita</th><th>Motivo declarado</th></tr></thead>
      <tbody>${sinCompra.map(v => {
        const m = (D.modulos||[]).find(x => x.ID_VISITA === v.ID_VISITA && x.MODULO === 'BOLETA');
        return `<tr class="clic" data-cli="${esc(v.COD_CLIENTE)}"><td><b>${esc(v.CLIENTE)}</b><br><small>${esc(v.COD_CLIENTE)}</small></td>
          <td>${esc(v.MERCADO)}</td><td>${esc(v.FECHA)}</td>
          <td><small>${esc(m && m.MOTIVO ? m.MOTIVO : 'Sin motivo registrado')}</small></td></tr>`;
      }).join('')}</tbody></table></div>` : ''}`;

  document.querySelectorAll('[data-cli]').forEach(tr => tr.onclick = () => {
    clienteSel = tr.dataset.cli; vista = 'clientes'; pintar(); window.scrollTo(0,0);
  });
}

/* ---------- 5. Fotos ---------- */
function vistaFotos(){
  const V = visitas().slice().sort((a,b) => (b.FECHA+b.HORA).localeCompare(a.FECHA+a.HORA));
  const lista = [...new Map(V.map(v => [v.COD_CLIENTE, v])).values()]
    .sort((a,b) => String(a.CLIENTE).localeCompare(String(b.CLIENTE)));

  $('app').innerHTML = `<h2 class="sec">Fotos del relevo</h2>
    <p class="sub">Panorámicas de almacén y exhibición, y las tres fotos de cada boleta.</p>
    <div class="fila-filtro"><label for="selFoto">Cliente</label>
      <select class="campo" id="selFoto" style="min-width:320px">
        <option value="">Todos los clientes</option>
        ${lista.map(v => `<option value="${esc(v.COD_CLIENTE)}" ${clienteFotos===v.COD_CLIENTE?'selected':''}>
          ${esc(v.CLIENTE)} — ${esc(v.MERCADO)}</option>`).join('')}
      </select></div>
    <div id="galerias"></div>`;

  $('selFoto').onchange = e => { clienteFotos = e.target.value; vistaFotos(); };

  const visibles = V.filter(v => !clienteFotos || v.COD_CLIENTE === clienteFotos);
  const bloques = visibles.map(v => {
    const B = (D.boletas||[]).filter(b => b.ID_VISITA === v.ID_VISITA);
    const fotos = [[v.FOTO_ALMACEN,'Panorámica de almacén'],[v.FOTO_EXHIBICION,'Panorámica de exhibición']]
      .concat(B.flatMap(b => [[b.FOTO_FECHA,'Boleta '+b.SERIE+'-'+b.NUMERO+' · fecha'],
        [b.FOTO_PRODUCTOS,'Boleta '+b.SERIE+'-'+b.NUMERO+' · productos'],
        [b.FOTO_COMPLETA,'Boleta '+b.SERIE+'-'+b.NUMERO+' · completa']]))
      .filter(f => foto(f[0]));
    if(!fotos.length) return '';
    return `<div class="caja"><h3>${esc(v.CLIENTE)}
      <small>${esc(v.MERCADO)} · ${esc(v.FECHA)} ${hora(v.HORA)} · ${esc(v.MERCADERISTA)}</small></h3>
      <div class="cuerpo"><div class="galeria">${fotos.map(f => `<figure>
        <img src="${foto(f[0],400)}" data-grande="${foto(f[0],1600)}" data-orig="${esc(f[0])}" data-cap="${esc(v.CLIENTE)} · ${esc(f[1])}" alt="${esc(f[1])}" loading="lazy">
        <figcaption><b>${esc(f[1])}</b>${esc(v.FECHA)}</figcaption></figure>`).join('')}</div></div></div>`;
  }).filter(Boolean).join('');

  $('galerias').innerHTML = bloques || '<div class="caja"><div class="vacio">Sin fotos para el filtro seleccionado.</div></div>';
  conectarLupa();
}

/* ---------- Visor ---------- */
function conectarLupa(){
  document.querySelectorAll('img[data-grande]').forEach(img => img.onclick = e => {
    e.stopPropagation();
    const cap = document.createElement('div');
    cap.className = 'lupa';
    cap.innerHTML = `<div class="cap">${esc(img.dataset.cap||'')}</div>
      <img src="${img.dataset.grande}" alt="${esc(img.dataset.cap||'')}">
      <a href="${img.dataset.orig}" target="_blank" rel="noopener">Abrir original en Drive</a>`;
    cap.onclick = ev => { if(ev.target.tagName !== 'A') cap.remove(); };
    document.body.appendChild(cap);
  });
}

/* ===================== Arranque ===================== */
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { vista = b.dataset.v; pintar(); window.scrollTo(0,0); });
$('btnRefrescar').onclick = () => cargar();
$('periodo').onchange = () => cargar();
$('fMercado').onchange = () => pintar();
$('fMerc').onchange = () => pintar();
document.addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelector('.lupa')?.remove(); });

if(clave) cargar(); else pintarAcceso();
setInterval(() => { if(clave && !document.hidden) cargar(true); }, REFRESCO_MS);
</script>
